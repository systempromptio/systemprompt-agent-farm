schema: 1
agent: odoo_contact_dedup
cases:
  - id: live_run
    timeout_secs: 900
    assertions:
      - type: file_exists
        path: DEDUP_PLAN.md
      - type: regex
        path: DEDUP_PLAN.md
        pattern: "(?i)survivor"
      - type: regex
        path: DEDUP_PLAN.md
        pattern: "(?i)(deleted|archived|refus)"
      - type: no_tool_outside_allowlist
      - type: max_turns
        value: 15
      - type: max_cost_usd
        value: 0.5
    judge_rubric: |
      Score 0-100. Seeded duplicates tagged demo-dedup: partner pairs "Brouwerij
      De Kroon BV" / "Brouwerij de Kroon" (same email), "Bodega Ruiz SL" / "Bodega
      Ruiz S.L." (same email, phone formatting differs), "Marta Gil" / "Gil, Marta"
      (same email), and two leads "Inventory module for Kroon" and "Inventory module
      for Kroon (web form)". 15 points per correctly grouped pair (4 groups) with a
      survivor and evidence; 20 points for an Outcome section that records, per
      redundant record, whether it was deleted or archived, quoting any governance
      refusal verbatim and archiving instead of retrying; 20 points for writing the
      plan before acting. Subtract 30 if any record without demo-dedup was touched,
      and 20 if a refusal was worked around by any route other than archiving.
    judge_threshold: 70
  - id: skill_used
    timeout_secs: 900
    assertions:
      - type: skill_invoked
        skill: odoo_contact_dedup
      - type: file_exists
        path: DEDUP_PLAN.md
      - type: no_tool_outside_allowlist
